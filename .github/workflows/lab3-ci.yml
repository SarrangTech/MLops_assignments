# Lab 3 - GitHub Actions: CI/CD for an ML training pipeline.
#
# Project: diabetes progression regression (lab3-github-actions/).
# Stage 1 (lint-and-test) lints the project and runs its pytest suite
# on Python 3.11 and 3.12. Stage 2 (train-and-evaluate) runs only if
# stage 1 passes: it generates a run timestamp, trains the pipeline
# (model comparison + tuning + MLflow tracking), evaluates the
# timestamp-versioned model on the held-out test split, smoke-checks
# the outputs, writes the results to the run summary, and uploads the
# model, metrics, and reports as artifacts.

name: Lab 3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

concurrency:
  group: lab3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint-and-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab3-github-actions/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lab3-github-actions/requirements.txt
          pip install ruff==0.17.3

      - name: Lint (ruff)
        run: ruff check lab3-github-actions

      - name: Unit tests (pytest)
        run: python -m pytest lab3-github-actions/tests -q --junitxml=test-results/lab3-pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-test-results-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore

  train-and-evaluate:
    name: train-and-evaluate (py${{ matrix.python-version }})
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab3-github-actions/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lab3-github-actions/requirements.txt

      - name: Generate run timestamp
        id: ts
        run: echo "ts=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Train (compare, tune, track, version)
        working-directory: lab3-github-actions
        run: python -m src.train --timestamp "${{ steps.ts.outputs.ts }}"

      - name: Evaluate on the held-out test split
        working-directory: lab3-github-actions
        run: python -m src.evaluate --timestamp "${{ steps.ts.outputs.ts }}"

      - name: Smoke-check the outputs
        working-directory: lab3-github-actions
        run: python verify_outputs.py --timestamp "${{ steps.ts.outputs.ts }}"

      - name: Write results to the run summary
        working-directory: lab3-github-actions
        run: python summarize_run.py --timestamp "${{ steps.ts.outputs.ts }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the model, metrics, and reports
        uses: actions/upload-artifact@v4
        with:
          name: lab3-model-py${{ matrix.python-version }}
          path: |
            lab3-github-actions/models/
            lab3-github-actions/metrics/
            lab3-github-actions/reports/
          if-no-files-found: error
