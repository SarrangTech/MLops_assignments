# Lab 3 — GitHub Actions CI for the Lab 1 Wine pipeline
# Drop at: MLops_assignments/.github/workflows/lab3-ci.yml  (repo root, not inside a lab folder)
# What it does on every push / PR to main:
#   1. Checks out the repo on a clean Ubuntu runner
#   2. Installs lab1-logging/requirements.txt (pip cache speeds reruns)
#   3. Runs the training pipeline end-to-end and fails the build if it errors
#   4. Smoke-checks that a model file and a log file were actually produced
#   5. Writes a short run summary to the Actions run page
#   6. Uploads the trained model + logs as build artifacts you can download from the Actions tab
name: lab3-ci

# Personal modification 4 (Lab 3): one active run per branch — a newer push
# cancels the stale run instead of letting both finish and race on artifacts.
concurrency:
  group: lab3-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
  # Personal modification 1 (2026-10-13): weekly scheduled run, Mondays 13:00 UTC,
  # so the pipeline is exercised even in weeks with no pushes.
  schedule:
    - cron: "0 13 * * 1"

jobs:
  train-and-verify:
    runs-on: ubuntu-latest
    # Personal modification 2 (2026-10-13): matrix over the two Python versions
    # the course materials use, instead of a single pinned version.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab1-logging/requirements.txt

      - name: Install dependencies
        run: pip install -r lab1-logging/requirements.txt

      - name: Run training pipeline
        working-directory: lab1-logging
        run: python train.py

      # Personal modification 3 (2026-10-13): smoke check — fail the build if the
      # training run produced no model file or no log file, instead of uploading
      # an empty artifact and calling it green.
      - name: Smoke check model and log outputs
        run: |
          test -d lab1-logging/models && find lab1-logging/models -type f | grep -q . || { echo "No model file produced"; exit 1; }
          test -d lab1-logging/logs && find lab1-logging/logs -type f | grep -q . || { echo "No log file produced"; exit 1; }
          echo "Outputs present:"
          find lab1-logging/models lab1-logging/logs -type f

      # Personal modification 5 (Lab 3): publish what the run produced to the
      # run's summary page, so a checker can see the outputs without
      # downloading the artifact first.
      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Lab 3 CI — training outputs (Python ${{ matrix.python-version }})"
            echo ""
            echo "**Model files:**"
            find lab1-logging/models -type f 2>/dev/null | sed 's/^/- /' || echo "- none"
            echo ""
            echo "**Log files:**"
            find lab1-logging/logs -type f 2>/dev/null | sed 's/^/- /' || echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wine-model-and-logs-py${{ matrix.python-version }}
          path: |
            lab1-logging/models/
            lab1-logging/logs/
          if-no-files-found: warn
