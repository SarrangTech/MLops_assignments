# Lab 3 — GitHub Actions CI for a self-contained ML training pipeline
# Location: MLops_assignments/.github/workflows/lab3-ci.yml — the repo root,
# where GitHub Actions requires workflow files to live.
# Two stages: a test stage (lint + unit tests) gates a training stage that
# runs the pipeline in lab3-github-actions/ and publishes its outputs as
# artifacts. Both stages run on Python 3.11 and 3.12.
name: lab3-ci

# One active run per branch: a newer push cancels the stale run instead of
# letting both finish and race on artifacts.
concurrency:
  group: lab3-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
  # Weekly scheduled run (Mondays 13:00 UTC), so the pipeline is exercised
  # even in weeks with no pushes.
  schedule:
    - cron: "0 13 * * 1"

jobs:
  test:
    name: lint-and-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab3-github-actions/requirements.txt

      - name: Install dependencies
        run: pip install -r lab3-github-actions/requirements.txt

      - name: Install linter
        run: pip install ruff==0.17.3

      - name: Lint
        run: ruff check lab3-github-actions

      - name: Unit tests
        run: python -m pytest lab3-github-actions/tests -q

  train:
    name: train-and-publish (py${{ matrix.python-version }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab3-github-actions/requirements.txt

      - name: Install dependencies
        run: pip install -r lab3-github-actions/requirements.txt

      - name: Train model
        run: python lab3-github-actions/train.py

      # Fail the build if training left any output missing or empty,
      # instead of uploading an incomplete artifact and calling it green.
      - name: Smoke check outputs
        run: |
          test -s lab3-github-actions/models/model.joblib
          test -s lab3-github-actions/reports/metrics.json
          test -s lab3-github-actions/logs/train.log
          echo "All outputs present and non-empty."

      # Publish the run's metrics to the run summary page, so the result
      # can be read without downloading the artifact first.
      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Lab 3 CI — training results (Python ${{ matrix.python-version }})"
            echo ""
            echo '```json'
            cat lab3-github-actions/reports/metrics.json 2>/dev/null || echo "{}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model, metrics and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-model-py${{ matrix.python-version }}
          path: |
            lab3-github-actions/models/
            lab3-github-actions/reports/
            lab3-github-actions/logs/
          if-no-files-found: warn
