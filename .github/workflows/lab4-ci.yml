# Lab 4 - MLflow: experiment tracking and model registry.
#
# Project: lab4-mlflow-tracking/ (California housing regression).
# Stage 1 (lint-and-test) lints the project and runs its pytest suite
# on Python 3.11 and 3.12; the tests use temporary MLflow tracking
# stores, never the project database. Stage 2 (experiments-and-
# registry) runs only if stage 1 passes: it runs the tracked
# experiment grid from a fresh store, registers the best run if the
# promotion gate passes, scores the champion loaded from the
# registry, serves it with `mlflow models serve` and compares the
# HTTP answers with the in-process model, smoke-checks all outputs,
# writes the results to the run summary, and uploads the reports as
# artifacts.
#
# The push / pull_request triggers are path-filtered: this workflow
# runs only when the Lab 4 project or the workflow itself changes.

name: Lab 4 CI

on:
  push:
    branches: [main]
    paths:
      - "lab4-mlflow-tracking/**"
      - ".github/workflows/lab4-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "lab4-mlflow-tracking/**"
      - ".github/workflows/lab4-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

concurrency:
  group: lab4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint-and-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab4-mlflow-tracking/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lab4-mlflow-tracking/requirements.txt
          pip install ruff==0.17.3

      - name: Lint (ruff)
        run: ruff check lab4-mlflow-tracking

      - name: Unit tests (pytest)
        run: python -m pytest lab4-mlflow-tracking/tests -q --junitxml=test-results/lab4-pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab4-test-results-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore

  experiments-and-registry:
    name: experiments-and-registry (py${{ matrix.python-version }})
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab4-mlflow-tracking/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lab4-mlflow-tracking/requirements.txt

      - name: Run the tracked experiment grid
        working-directory: lab4-mlflow-tracking
        run: python -m src.run_experiments --fresh

      - name: Register the best run and apply the promotion gate
        working-directory: lab4-mlflow-tracking
        run: python -m src.register_and_promote

      - name: Score the champion from the registry
        working-directory: lab4-mlflow-tracking
        run: python -m src.score_with_champion

      - name: Serve the champion and check the HTTP predictions
        working-directory: lab4-mlflow-tracking
        run: python -m src.serve_check

      - name: Smoke-check the outputs
        working-directory: lab4-mlflow-tracking
        run: python verify_outputs.py

      - name: Write results to the run summary
        working-directory: lab4-mlflow-tracking
        run: python summarize_run.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the experiment and registry reports
        uses: actions/upload-artifact@v4
        with:
          name: lab4-experiment-py${{ matrix.python-version }}
          path: lab4-mlflow-tracking/reports/
          if-no-files-found: error
